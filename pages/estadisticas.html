<!DOCTYPE html>
<html lang="es">
    <!-- head-->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Avistamiento de Aves en Chile</title>
        <link rel="stylesheet" type="text/css" href="../css/index.css">
        <link rel="stylesheet" type="text/css" href="../css/estadisticas.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&family=Roboto&display=swap" rel="stylesheet">
    </head>
    
    <!-- body-->
    <body>
        <!-- header-->
        <header>
             <!-- navbar-->
            <nav>
                <img id="logo-id" src="../images/logo.svg" alt="Logo de Avistamiento de Aves en Chile"> <!-- source de logo: https://svglogogenerator.com/?id=6f4251d0-d188-4d2e-b0a3-a40d4e3cbf73-->
                <a class="navbar-page" href="../index.html">Inicio</a>
                <a class="navbar-page" href="registroVoluntarios.html">Registrarme</a>    <!-- Registro de Voluntarios-->
                <a class="navbar-page" href="registroAves.html">Informar Avistamiento</a> <!-- Informar Avistamiento de Aves-->
                <a class="navbar-page" href="listadoAves.html">Listado de Aves</a>        <!-- Listado de Aves-->
                <a class="navbar-page" href="estadisticas.html">Estadísticas</a>          <!-- Estadísticas-->
                <a class="navbar-login" href="login.html">Login</a>                       <!-- Login-->
            </nav>

            <h1>Estadísticas</h1>
            <p>Indicadores y métricas</p>
        </header>

        <!-- main-->
        <main>

            <!-- section: indicadores-->
             <div class="indicators">
                <article class="indicator">
                    <h2 id="volunteer-counter">0</h2>
                    <p>Voluntarios registrados</p>
                </article>

                <article class="indicator">
                    <h2 id="sighting-counter">0</h2>
                    <p>Avistamientos registrados</p>
                </article>
            </div>

            <!-- section: gráficos-->
            <div class="graphs">
                <article class="graph-sightings-by-month">
                    <h2>Avistamientos de aves por mes</h2>
                    <canvas id="graph-sightings-by-month" role="img" aria-label="Gráfico de barras de avistamientos por mes"></canvas>
                </article>
                    
                <article class="graph-volunteers-regions">
                    <h2>Voluntarios por región</h2>
                    <canvas id="graph-volunteers-regions" role="img" aria-label="Gráfico de torta de voluntarios por región"></canvas>
                </article>
            </div>
        </main>

        <!-- Scripts-->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
        <script src="../js/dataConst.js"></script>
        <script src="../js/data.js"></script>
        <script src="../js/estadisticas/estadisticas.js"></script>
    </body>
</html>
