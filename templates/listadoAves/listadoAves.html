<!DOCTYPE html>
<html lang="es">
    <!-- head-->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Avistamiento de Aves en Chile</title>
        <link rel="stylesheet" type="text/css" href="../css/index.css">
        <link rel="stylesheet" type="text/css" href="../css/listado.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&family=Roboto&display=swap" rel="stylesheet">
    </head>
    
    <!-- body-->
    <body>
        <!-- header-->
        <header>
             <!-- navbar-->
            <nav>
                <img id="logo-id" src="../images/logo.svg" alt="Logo de Avistamiento de Aves en Chile"> <!-- source de logo: https://svglogogenerator.com/?id=6f4251d0-d188-4d2e-b0a3-a40d4e3cbf73-->
                <a class="navbar-page" href="../index.html">Inicio</a>
                <a class="navbar-page" href="registroVoluntarios.html">Registrarme</a>    <!-- Registro de Voluntarios-->
                <a class="navbar-page" href="registroAves.html">Informar Avistamiento</a> <!-- Informar Avistamiento de Aves-->
                <a class="navbar-page" href="listadoAves.html">Listado de Aves</a>        <!-- Listado de Aves-->
                <a class="navbar-page" href="estadisticas.html">Estadísticas</a>          <!-- Estadísticas-->
                <a class="navbar-login" href="login.html">Login</a>                       <!-- Login-->
            </nav>

            <h1>Avistamiento de Aves en Chile</h1>
            <p>Registro de avistamientos de aves en Chile </p>
        </header>

        <!-- main-->
        <main>

            <!-- section: filtros y ordenamiento-->
            <div class="filter">
                <form>
                    <div class="field-filter">
                        <label for="bird-type-filter">Filtrar por tipo de Aves</label>
                        <select id="bird-type-filter">
                            <option value="">Todos</option>
                        </select>
                    </div>

                    <div class="field-filter">
                        <label for="order">Ordenar por</label>
                        <select id="order">
                            <option value="date-desc">Fecha (más reciente primero)</option>
                            <option value="date-asc">Fecha (más antigua primero)</option>
                            <option value="place-asc">Lugar (A-Z)</option>
                            <option value="place-desc">Lugar (Z-A)</option>
                            <option value="birdType-asc">Tipo de ave (A-Z)</option>
                            <option value="birdType-desc">Tipo de ave (Z-A)</option>
                            <option value="birdName-asc">Nombre de ave (A-Z)</option>
                            <option value="birdName-desc">Nombre de ave (Z-A)</option>
                        </select>
                    </div>
                </form>
            </div>

            <!-- section: tabla de resultados-->
            <div class="results-table">
                <table>
                    <caption>Avistamiento registrados</caption>
                    <thead>
                        <tr>
                            <th scope="col">Tipo de ave</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Lugar</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Hora</th>
                            <th scope="col">Registro</th>
                        </tr>
                    </thead>
                    <tbody id="results-table"></tbody>
                </table>
            </div>

            <!-- Paginación-->
            <nav class="paginacion">
                <button id="btn-previous" type="button">Anterior</button>
                <span id="page-number">Página 1 de 1</span>
                <button id="btn-next" type="button">Siguiente</button>
            </nav>
        </main>

        <!-- Scripts-->
        <script src="../js/dataConst.js"></script>
        <script src="../js/data.js"></script>
        <script src="../js/listadoAves/listadoAves.js"></script>
    </body>
</html>
